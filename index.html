<style>
:root{--bg:#0d1020;--panel:#151a30;--panel2:#1c2240;--line:#2a3158;--text:#e8ebff;--muted:#9aa1c8;--acc:#7c5cff;--acc2:#22d3ee;--ok:#22c55e;--near:#f59e0b;--tone:#c084fc;--bad:#f43f5e;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(1100px 600px at 5% -10%,#2a1f6b66,transparent),radial-gradient(900px 500px at 105% 5%,#0e5d6b44,transparent),var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}
.brand .sub{font-size:12px;font-weight:500;color:var(--muted)}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:22px;box-shadow:0 6px 24px #7c5cff55}
.hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font:inherit;font-weight:650;cursor:pointer;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--acc),#5b8cff);color:#fff}
.seg.sm button{padding:4px 10px;font-size:13px}
.streak{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:800}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 14px;border-radius:12px;font:inherit;font-weight:650;cursor:pointer}
nav.tabs button.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#3b2f8f,#1f4d7a)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.intro{color:var(--muted);margin:0 0 14px}
.notice{background:#3a2a0c;border:1px solid #7a5a12;color:#ffe2a8;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.notice.err{background:#3a0f1c;border-color:#7a1d36;color:#ffc2cf}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 16px;border-radius:12px;font:inherit;font-weight:650;cursor:pointer;transition:transform .05s,background .2s}
.btn:hover:not(:disabled){background:#252c55}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--acc),#5b8cff);border-color:transparent;color:#fff}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#8d72ff,#6c98ff)}
.btn.rec:hover:not(:disabled){background:linear-gradient(135deg,#f43f5e,#fb7185)}
.btn.rec{background:linear-gradient(135deg,#f43f5e,#fb7185);border-color:transparent;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #f43f5e88}50%{box-shadow:0 0 0 10px #f43f5e00}}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.ghost{background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:#2b2f63;color:#fff;border-color:#4b4fa0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.navx{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:#232a52;color:#c9cdf5}
.badge.lv1{background:#12392a;color:#86efac}.badge.lv2{background:#3b2f0c;color:#fcd34d}.badge.lv3{background:#3d1220;color:#fda4af}
.badge.best{background:#2c2350;color:#e9d5ff}
.target{font-size:clamp(22px,3.6vw,32px);line-height:1.6;font-weight:650;letter-spacing:.2px;margin:6px 0 10px}
.practice.read .target{font-size:clamp(17px,2.2vw,21px);font-weight:500;line-height:1.8}
.target .line+.line{margin-top:4px}
.w{border-radius:6px;padding:0 2px;transition:background .15s,color .15s}
.w.speaking{background:#7c5cff55;color:#fff}
.w.ok{color:#86efac}
.w.near{color:#fcd34d;text-decoration:underline wavy #f59e0b88}
.w.tone{color:#e9d5ff;background:#c084fc33;text-decoration:underline wavy var(--tone)}
.w.sub{color:#fda4af;background:#f43f5e22;text-decoration:underline wavy var(--bad)}
.w.miss{color:#fda4af99;text-decoration:line-through;text-decoration-color:var(--bad)}
.tip{background:#18203d;border-left:3px solid var(--acc2);padding:10px 12px;border-radius:8px;color:#cfe9f3;font-size:14.5px;margin-bottom:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px;margin:8px 0}
.opts label{display:flex;align-items:center;gap:6px}
.chk{cursor:pointer}
input[type=range]{accent-color:var(--acc);width:110px}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
.meter{height:6px;background:#0f1430;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--near),var(--bad));transition:width .06s}
.live{min-height:24px;color:var(--muted);font-style:italic;font-size:15px}
.result{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.score-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:0;--c:var(--ok);width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#232a52 0);display:grid;place-items:center;flex:0 0 auto}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:24px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:110px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:18px}
.fb{margin:10px 0;font-weight:600}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.heardbox{background:#0f1430;border-radius:10px;padding:8px 12px;color:#cdd2f5;font-size:14.5px;margin:8px 0}
.fixes{margin:6px 0 0;padding-left:18px;font-size:14.5px}
.fixes li{margin:3px 0}
.fixes b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pg{text-align:left;cursor:pointer;color:var(--text);font:inherit;transition:border-color .2s,transform .05s}
.pg:hover{border-color:#5b5fc0}
.pg-h{font-weight:800;font-size:17px;margin-bottom:4px}
.pg-ex{color:var(--muted);font-size:14px}
.pg-best{margin-top:8px;font-size:13px;color:#e9d5ff}
.pair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pair-prog{color:var(--muted);font-weight:650}
.words{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.word{min-width:110px;text-align:center;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-size:26px;font-weight:750;color:var(--muted)}
.word.target{border-color:var(--acc);color:#fff;background:#2a2366;box-shadow:0 0 0 4px #7c5cff33}
button.word{cursor:pointer;color:var(--text);font-family:inherit}
button.word:hover:not(:disabled){border-color:#5b5fc0}
.word.right{border-color:var(--ok);background:#12392a;color:#bbf7d0}
.word.wrong{border-color:var(--bad);background:#3d1220;color:#fecdd3}
.center{text-align:center}
.pfb{min-height:28px;font-weight:700;text-align:center;margin:8px 0}
.pfb.ok{color:#86efac}.pfb.bad{color:#fda4af}.pfb.meh{color:#fcd34d}
.wu{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media(max-width:720px){.wu{grid-template-columns:1fr}}
.wu-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wu-list li{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14.5px}
.wu-list li b{flex:1;font-weight:600}
.wu-list li em{color:var(--muted);font-style:normal;font-size:13px}
.wu-list li.cur{border-color:var(--acc);background:#221d55}
.wu-list li.done{opacity:.55}
.wu-list li.done b::after{content:" ✓";color:var(--ok)}
.wu-stage{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.wu-ring{position:relative;width:170px;height:170px}
.wu-ring svg{transform:rotate(-90deg)}
.wu-ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800}
.wu-name{font-size:24px;font-weight:800}
.wu-how{color:#cdd2f5;max-width:520px}
textarea{width:100%;min-height:160px;background:#0f1430;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{font-size:28px;display:block}
.tile small{color:var(--muted)}
.heat{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.heat i{width:22px;height:22px;border-radius:5px;background:#1d2347;display:block}
.heat i.l1{background:#3b3486}.heat i.l2{background:#5a4bd1}.heat i.l3{background:#7c5cff}.heat i.l4{background:#a78bfa}
.heat i.today{outline:2px solid var(--acc2);outline-offset:1px}
.hl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.hl i{width:12px;height:12px;border-radius:3px;display:inline-block}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;padding:8px 12px;font-size:14.5px}
.item .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sc{font-weight:800}
.sec-title{font-weight:800;margin:18px 0 8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
footer{margin-top:28px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:8px}
footer .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#222a55;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
.subtabs{margin-bottom:12px}
.topic{font-size:clamp(20px,3vw,27px);font-weight:750;line-height:1.35;margin:4px 0 10px}
.bigtimer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;margin:6px 0}
.bigtimer.over{color:var(--bad)}
.cam{width:100%;max-width:340px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#000;display:block;margin:8px auto;transform:scaleX(-1)}
video.play{width:100%;max-width:420px;border-radius:14px;background:#000;display:block;margin:6px auto 12px}
.taboo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 10px;font-size:14px;color:var(--muted)}
.taboo span{background:#3d1220;color:#fecdd3;border-radius:999px;padding:3px 10px;font-weight:650}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0}
.skill{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.skill .sk-h{display:flex;justify-content:space-between;font-weight:700}
.skill small{color:var(--muted);font-size:12px;display:block;margin-top:4px}
.bar{height:8px;background:#0f1430;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.prep{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.prep label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.prep textarea{min-height:70px;font-size:15px;font-weight:400}
.checks{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.checks span{border-radius:999px;padding:5px 11px;font-size:14px;font-weight:650;background:#3d1220;color:#fecdd3}
.checks span.yes{background:#12392a;color:#bbf7d0}
.checks span.opt{background:#232a52;color:#c9cdf5}
.trx{background:#0f1430;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.7;color:#cdd2f5}
.trx div+div{margin-top:4px}
.trx mark{background:#f59e0b33;color:#fcd34d;border-radius:4px;padding:0 3px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps button{flex:1;min-width:150px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer}
.steps button b{display:block;color:var(--text)}
.steps button.on{border-color:var(--acc);background:#221d55}
.steps button.done b::after{content:" ✓";color:var(--ok)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(max-width:720px){.ba{grid-template-columns:1fr}}
.ba div{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.ba b{display:block;margin-bottom:4px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row2 input[type=text]{flex:1;min-width:180px;background:#0f1430;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}

/* ---- v2: bigger controls, AI chip, dialogs, coach ---- */
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.btn{min-height:46px;padding:11px 18px;font-size:16px}
.btn.sm{min-height:40px}
.chip{min-height:38px}
nav.tabs button,.seg button{min-height:42px}
.seg.sm button{min-height:34px}
.practice .controls .btn.primary,.practice .controls .btn.rec,#talkBtn{min-height:58px;font-size:18px;padding:12px 26px;border-radius:14px}
.aichip{display:inline-flex;align-items:center;gap:7px;min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer;font-size:14px}
.aichip i{width:9px;height:9px;border-radius:50%;background:#64708f;display:inline-block}
.aichip.ready i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.aichip.loading i{background:var(--near);animation:pulse 1.2s infinite}
.aichip.error i{background:var(--bad)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;background:#05071099;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.modal.hidden{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 70px #000a}
.sheet h2{margin:0 0 6px;font-size:22px}
.sheet p{margin:8px 0;color:#cdd2f5}
.sheet .x{float:right}
.sheet ol{padding-left:0;list-style:none;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.sheet ol li{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:12px;padding:12px}
.sheet ol li b.n{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#5b8cff);display:grid;place-items:center;color:#fff}
.sheet .controls .btn{flex:1 1 150px}
.pbar{height:12px;border-radius:99px;background:#0f1430;overflow:hidden;margin:10px 0 4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.kv{font-size:13.5px;color:var(--muted);margin:4px 0}
.warn{background:#3a2a0c;border:1px solid #7a5a12;color:#ffe2a8;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.coach{margin-top:14px;background:#14213d;border:1px solid #2b4a7a;border-radius:14px;padding:12px 14px}
.coach .sec-title{margin:0 0 6px}
.coach-body{white-space:pre-wrap;color:#e3ecff}
.coach small{display:block;color:var(--muted);margin-top:8px}
.steps-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.steps-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps-dots i.on{background:var(--acc2)}
@media(max-width:720px){
 .wrap{padding:10px 12px 90px}
 header{padding-bottom:8px}
 .brand{font-size:17px}.brand .sub{display:none}
 .hdr-right{width:100%;justify-content:space-between}
 nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:0 -12px 12px;padding-left:12px;padding-right:12px}
 .practice .controls .btn{flex:1 1 45%}
 .practice .controls #recBtn,#talkBtn{flex:1 1 100%;order:-1}
 .card{padding:16px}
}

.lead{margin-top:16px;background:#162033;border:1px solid #2b4a7a;border-radius:14px;padding:14px}
.lead h3{margin:0 0 4px;font-size:17px}
.lead p{margin:4px 0 10px;color:#cdd2f5;font-size:14.5px}
.lead .f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lead label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:650}
.lead input[type=email],.lead input[type=text],.lead input[type=tel]{background:#0f1430;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;min-height:46px}
.lead .em{grid-column:1/-1}
.lead .chk{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500;margin:10px 0}
.lead .chk input{margin-top:4px;width:20px;height:20px}
.lead .msg{margin-top:8px;font-weight:650}
.lead .msg.ok{color:#86efac}.lead .msg.bad{color:#fda4af}
@media(max-width:720px){.lead .f{grid-template-columns:1fr}}
</style>

<div class="wrap" id="app"></div>

<script>
'use strict';

function t(k, vars) {
  let s = (I18N[S.ui] && I18N[S.ui][k]) ?? I18N.en[k] ?? k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b);

}

/* ============================== text scoring ============================== */
function norm(s) {

  const o1 = others.find(o => has(first, o));

  const o2 = others.find(o => alts.some(a => has(a, o)));

/* ============================== articulation: analysis ============================== */
const nPhrase = p => norm(p).join(' ');
function countPhrases(text, phrases) {
  let s = ' ' + text + ' '; const found = {}; let total = 0;
  [...new Set(phrases.map(nPhrase))].filter(Boolean).sort((a, b) => b.length - a.length).forEach(p => {
    const pat = ' ' + p + ' '; let idx, n = 0;
    while ((idx = s.indexOf(pat)) !== -1) { n++; s = s.slice(0, idx) + ' ¦ ' + s.slice(idx + pat.length); }
    if (n) { found[p] = n; total += n; }
  });
  return { found, total };
}
const fmtTime = sec => { const neg = sec < 0; sec = Math.abs(Math.round(sec)); return (neg ? '+' : '') + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
const skColor = v => v >= 80 ? 'var(--ok)' : v >= 60 ? 'var(--near)' : 'var(--bad)';
function analyze(r, cfg, lang) {
  const toks = norm(r.transcript); const text = toks.join(' '); const words = toks.length;
  if (words < 8) return { tooShort: true, words };
  const speech = Math.max(r.speech, 1), mins = speech / 60;
  const wpm = Math.round(words / mins);
  const fill = countPhrases(text, FILLERS[lang]); const fpm = fill.total / mins;
  const longP = (r.pauses || []).filter(p => p >= 1.5).length, ppm = longP / mins;
  const mk = {}; for (const [k, list] of Object.entries(MARKERS[lang])) mk[k] = Object.keys(countPhrases(text, list).found);
  const tab = cfg.taboo ? countPhrases(text, cfg.taboo).found : {};
  const tabooN = Object.values(tab).reduce((a, b) => a + b, 0);
  const fillSet = new Set(FILLERS[lang].map(nPhrase));
  const grams = {};
  for (let i = 0; i + 3 <= toks.length; i++) { const g = toks.slice(i, i + 3); if (g.some(w => fillSet.has(w))) continue; const k = g.join(' '); grams[k] = (grams[k] || 0) + 1; }
  const repeats = [];
  Object.entries(grams).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).forEach(([g, n]) => {
    const w = g.split(' ');
    if (repeats.length < 3 && !repeats.some(([x]) => x.includes(w.slice(0, 2).join(' ')) || x.includes(w.slice(1).join(' ')))) repeats.push([g, n]);
  });
  const [lo, hi] = lang === 'vi' ? [150, 240] : [115, 170];
  const pace = clamp(wpm < lo ? 100 - (lo - wpm) * 1.2 : wpm > hi ? 100 - (wpm - hi) * 1.2 : 100);
  const confScore = r.conf > 0 ? clamp((r.conf - 0.5) / 0.42 * 100) : null;
  const clarity = clamp((confScore != null ? 0.55 * pace + 0.45 * confScore : pace) - 12 * tabooN);
  let structure = PREP_KEYS.reduce((a, k) => a + (mk[k].length ? 25 : 0), 0);
  if (mk.sequence.length) structure = Math.min(100, structure + 10);
  const over = r.speech - cfg.secs; let conc = 100;
  if (over > cfg.secs * 0.15) conc -= Math.min(40, over / cfg.secs * 80);
  conc -= Math.min(30, repeats.reduce((a, [, n]) => a + (n - 1) * 8, 0));
  if (words > 60 && new Set(toks).size / words < 0.35) conc -= 10;
  const conciseness = clamp(conc);
  const short = cfg.minSecs && r.speech < cfg.minSecs;
  const fluency = clamp(100 - Math.min(55, fpm * 6) - Math.min(35, ppm * 7) - (short ? 15 : 0));
  const skills = { clarity, structure, conciseness, fluency };
  const overall = Math.round((clarity + structure + conciseness + fluency) / 4);
  const tips = [];
  const topF = Object.entries(fill.found).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([w, n]) => `“${w}” ×${n}`).join(', ');
  if (fpm >= 3) tips.push(t('tip_fillers', { n: fill.total, top: topF }));
  PREP_KEYS.forEach(k => { if (!mk[k].length) tips.push(t('tip_' + k)); });
  if (longP >= 2) tips.push(t('tip_pauses', { n: longP }));
  repeats.slice(0, 1).forEach(([g, n]) => tips.push(t('tip_repeat', { g, n })));
  if (over > cfg.secs * 0.15) tips.push(t('tip_over', { s: Math.round(over) }));
  if (short) tips.push(t('tip_short', { s: Math.round(r.speech) }));
  if (wpm > hi + 15) tips.push(t('tip_fast', { w: wpm })); else if (wpm < lo - 20) tips.push(t('tip_slow', { w: wpm }));
  if (tabooN) tips.push(t('tip_taboo', { w: Object.keys(tab).join(', ') }));
  if (!tips.length) tips.push(t('tip_good'));
  return { words, wpm, fill, longP, mk, tab, repeats, skills, overall, tips, speech: r.speech };
}

    <label class="chk"><input type="checkbox" name="consent"> <span>${t('leadConsent')}</span></label>
    <button class="btn primary" type="submit">${t('leadSend')}</button>
    <div class="msg" role="status"></div></form>`;
}
async function submitLead(o) {
  const res = await fetch(LEADS_URL, {
    method: 'POST', // no Content-Type header on purpose: avoids a CORS preflight Apps Script cannot answer
    body: JSON.stringify({ score: LEADDATA.score, mode: LEADDATA.mode, metrics: LEADDATA.metrics, tips: LEADDATA.tips, email: o.email, name: o.name, phone: o.phone, summary: LEADSUM, consent: o.consent, utm: location.search.slice(1), website: document.getElementById('hp').value })
  });
  return res.json();
}
document.addEventListener('submit', async e => {
  const f = e.target; if (f.id !== 'leadForm') return; e.preventDefault();
  const msg = f.querySelector('.msg'), btn = f.querySelector('button[type=submit]');
  const email = f.email.value.trim();
  const bad = k => { msg.className = 'msg bad'; msg.textContent = t(k); };
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { bad('leadInvalid'); f.email.focus(); return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = t('leadSending');
  try {
    const r = await submitLead({ email, name: f.name.value.trim(), phone: f.phone.value.trim(), consent: f.consent.checked });
    if (r && r.ok) {
      try { gtag('event', 'generate_lead'); } catch { }
      msg.className = 'msg ok'; msg.textContent = t(r.mailed ? 'leadOk' : 'leadQueued'); f.querySelectorAll('input').forEach(x => x.disabled = true);
    } else { btn.disabled = false; bad(r && r.error === 'invalid_email' ? 'leadInvalid' : r && r.error === 'rate_limited' ? 'leadRate' : 'leadErr'); }
  } catch (err) { btn.disabled = false; bad('leadErr'); }
});
if (HAS_TTS) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); renderNotices(); }; }
render();
</script>
</body>
</html>
